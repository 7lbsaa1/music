<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial=1.0">
<title>MusicZone — عالم الأغاني</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== الشريط الجانبي ===== -->
    <aside class="sidebar">
        <div class="logo"><i class="fas fa-music"></i><span>MusicZone</span></div>
        <nav class="nav-menu">
            <a href="/" class="nav-item active"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="/#songs" class="nav-item"><i class="fas fa-music"></i><span>الأغاني</span></a>
            <a href="/#artists" class="nav-item"><i class="fas fa-microphone"></i><span>الفنانين</span></a>
        </nav>
        <div class="playlists-section">
            <h3>تصفية حسب الفنان</h3>
            <div id="sidebarArtists"></div>
        </div>
    </aside>

    <!-- ===== المحتوى ===== -->
    <div class="layout">
        <header class="hero">
            <div class="hero-text">
                <span class="hero-tag">🎧 millions أغنية في انتظارك</span>
                <h1>اكتشف عالم الموسيقى</h1>
                <p>استمع، ابحث، وحمّل أغانيك المفضلة بجودة عالية</p>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="ابحث عن أغنية أو فنان...">
                    <button id="searchBtn"><i class="fas fa-microphone"></i></button>
                </div>
            </div>
            <div class="hero-art"><img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80" alt=""></div>
        </header>

        <main class="main">
            <section id="songs" class="section">
                <div class="section-header">
                    <h2 id="songsTitle">🔥 الأغاني</h2>
                    <button class="chip" id="showAllBtn">عرض الكل</button>
                </div>
                <div class="grid" id="songsGrid"></div>
                <p id="noResults" class="no-results hidden">😕 لا توجد نتائج مطابقة...</p>
            </section>

            <section id="artists" class="section">
                <div class="section-header"><h2>🎤 الفنانين</h2></div>
                <div class="artists-row" id="artistsRow"></div>
            </section>
        </main>
    </div>

    <!-- ===== صفحة الأغنية الكاملة ===== -->
    <div id="songPage" class="song-page hidden">
        <button class="close-page" id="closePageBtn"><i class="fas fa-arrow-right"></i> رجوع</button>
        <div class="page-body">
            <div class="page-left">
                <img id="pageCover" src="" alt="">
                <div class="page-meta">
                    <h1 id="pageTitle"></h1>
                    <p id="pageArtist"></p>
                </div>
            </div>
            <div class="page-right">
                <div class="page-actions">
                    <button class="btn-play-big" id="pagePlayBtn"><i class="fas fa-play"></i> تشغيل</button>
                    <button class="btn-lyrics" id="lyricsBtn"><i class="fas fa-align-right"></i> إظهار الكلمات</button>
                    <a class="btn-download" id="downloadBtn" download><i class="fas fa-download"></i> تحميل</a>
                </div>
                <!-- 📜 صندوق الكلمات: العنوان + الصورة فوق والكلمات تحتها -->
                <div class="lyrics-box hidden" id="lyricsBox">
                    <div class="lyrics-header">
                        <img id="lyricsCover" src="" alt="">
                        <div>
                            <h3 id="lyricsTitle"></h3>
                            <p id="lyricsArtist"></p>
                        </div>
                    </div>
                    <div class="lyrics-text" id="lyricsText"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== المشغل السفلي ===== -->
    <footer class="player hidden" id="player">
        <div class="player-track">
            <img id="playerCover" src="" alt="">
            <div class="pt-info"><h4 id="playerTitle">—</h4><p id="playerArtist">—</p></div>
            <button class="like-btn" id="likeBtn"><i class="far fa-heart"></i></button>
        </div>
        <div class="player-center">
            <div class="pbtns">
                <button id="shuffleBtn" title="تشغيل عشوائي"><i class="fas fa-random"></i></button>
                <button id="prevBtn" title="السابق"><i class="fas fa-step-backward"></i></button>
                <button class="play-main" id="playBtn"><i class="fas fa-play"></i></button>
                <button id="nextBtn" title="التالي"><i class="fas fa-step-forward"></i></button>
                <button id="repeatBtn" title="تكرار"><i class="fas fa-redo"></i></button>
            </div>
            <div class="progress-row">
                <span id="current">0:00</span>
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="progress-thumb" id="progressThumb"></div>
                    </div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="player-extra">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volumeSlider" min="0" max="100" value="80">
        </div>
    </footer>

    <audio id="audio" preload="metadata"></audio>

    <script src="/data.js"></script>
    <script src="/script.js"></script>
</body>
</html>
